name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, so newly published vulnerabilities show up even without commits

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest==9.0.3 httpx==0.28.1
      - name: Tests
        run: python -m pytest -q tests

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t banktab:ci .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name banktab -p 127.0.0.1:8000:8000 banktab:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs banktab
          exit 1
      - name: Setup code is printed on first start
        run: docker logs banktab 2>&1 | grep -q "setup code"
