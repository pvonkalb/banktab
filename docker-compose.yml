# Self-hosting with Docker Compose:
#   cp .env.example .env      # then edit it
#   docker compose up -d
#   docker compose logs banktab   # shows the one-time setup code for the first account
#
# The app listens on 127.0.0.1:8000 only. Reach it through a reverse proxy or tunnel that adds
# HTTPS (Caddy, Cloudflare Tunnel, Tailscale serve). Don't publish port 8000 to the internet.

services:
  banktab:
    build: .
    container_name: banktab
    restart: unless-stopped
    env_file:
      - path: .env
        required: false      # every setting is optional
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - banktab-data:/data
    read_only: true            # the app only writes to /data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  banktab-data:
